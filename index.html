<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dòng tiền LAVIPCO</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
      background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:20px;padding:36px 28px;max-width:400px;width:100%;
      box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center}
    .logo{font-size:52px;margin-bottom:12px}
    h1{color:#1f3864;font-size:22px;margin-bottom:6px}
    .sub{color:#666;font-size:14px;margin-bottom:28px;line-height:1.5}
    .btn{display:block;width:100%;padding:16px;background:#1f3864;color:#fff;border:none;
      border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;
      margin-bottom:10px;transition:opacity .15s}
    .btn:active{opacity:.85}
    .btn.outline{background:#fff;color:#1f3864;border:2px solid #1f3864}
    .divider{color:#aaa;font-size:12px;margin:8px 0 16px}
    .info{background:#e8f0fe;border-radius:10px;padding:12px;font-size:12px;
      color:#1f3864;line-height:1.6;text-align:left;margin-top:16px}
    .info strong{display:block;margin-bottom:4px}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">💰</div>
  <h1>Dòng tiền LAVIPCO</h1>
  <p class="sub">App quản lý thu/chi · công nợ · dự báo dòng tiền<br>theo dự án xây lắp</p>

  <a id="btn-app" class="btn" href="#" target="_blank">🚀 Mở App (đầy đủ tính năng)</a>

  <div class="divider">hoặc</div>

  <a class="btn outline" href="https://docs.google.com/spreadsheets/d/1GHFKlN5Q86BnYIgyNeQpzP5ODMhWeky7VGE_3qQ1zyw/edit" target="_blank">
    📊 Mở Google Sheet trực tiếp
  </a>

  <div class="info">
    <strong>ℹ️ Về app này</strong>
    Chạy trên Google Apps Script + Google Sheets.<br>
    Yêu cầu đăng nhập tài khoản Google của LAVIPCO.
  </div>
</div>

<script>
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzMNGOB4VEAJKuM2CHlRX3oRw1eskPu6pUTpvuU4ZxaIkiJvTqr21nNC3fD_IhIuJdQ/exec';
  document.getElementById('btn-app').href = WEB_APP_URL;
</script>
</body>
</html>
